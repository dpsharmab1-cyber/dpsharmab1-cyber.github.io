# Deploys the Pack Studio payment functions to Supabase.
# Run it from the Actions tab ("Run workflow") after adding the repository secrets
# listed in pack-studio/backend/SETUP.md. Secrets stay encrypted in GitHub; they are
# never written to the repository or printed in the logs.
name: Deploy Pack Studio backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pack-studio/backend
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check every secret is set
        env:
          RZP_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RZP_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RZP_HOOK: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN PROJECT_REF RZP_ID RZP_SECRET RZP_HOOK; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v (see pack-studio/backend/SETUP.md)"; missing=1; fi
          done
          exit $missing

      - name: Test payment logic
        run: node --test --experimental-strip-types tests/billing.test.ts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Save Razorpay keys as function secrets
        env:
          RZP_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RZP_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RZP_HOOK: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            RAZORPAY_KEY_ID="$RZP_ID" \
            RAZORPAY_KEY_SECRET="$RZP_SECRET" \
            RAZORPAY_WEBHOOK_SECRET="$RZP_HOOK" \
            SITE_ORIGIN="https://dpsharmab1-cyber.github.io"

      - name: Deploy functions
        run: |
          supabase functions deploy create-order --project-ref "$PROJECT_REF"
          supabase functions deploy verify-payment --project-ref "$PROJECT_REF"
          supabase functions deploy razorpay-webhook --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Done
        run: |
          echo "### Pack Studio backend deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Webhook URL for Razorpay: https://${PROJECT_REF}.supabase.co/functions/v1/razorpay-webhook" >> "$GITHUB_STEP_SUMMARY"
