<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frame Studio · Free design tool with code export</title>
<meta name="description" content="Free browser design tool: frames, auto layout, vectors, text and images, with one-click export of any frame to HTML + CSS, React or Tailwind. No sign up, works offline, your files stay on your device.">
<meta name="theme-color" content="#f4f4f6">
<link rel="canonical" href="https://dpsharmab1-cyber.github.io/frame-studio/">
<meta property="og:type" content="website">
<meta property="og:title" content="Frame Studio: free design tool with code export">
<meta property="og:description" content="Design with frames and auto layout, then export real HTML, CSS, React or Tailwind. Free, in your browser.">
<meta property="og:url" content="https://dpsharmab1-cyber.github.io/frame-studio/">
<meta property="og:image" content="https://dpsharmab1-cyber.github.io/assets/og.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236D5BFF'/%3E%3Cpath d='M11 6v20M21 6v20M6 11h20M6 21h20' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body class="booting">

<header class="topbar">
  <button class="logo" id="btn-menu" aria-label="Main menu" title="Menu">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--acc)"/><path d="M11 6v20M21 6v20M6 11h20M6 21h20" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
    <svg class="i" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <button class="ib only-narrow" id="toggle-left" aria-label="Layers" title="Layers"><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
  <div class="doc">
    <input id="doc-name" class="doc-name" value="Untitled" aria-label="File name" spellcheck="false">
    <span id="save-state" class="save-state">Saved in this browser</span>
  </div>
  <div class="top-actions">
    <button class="ib" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button class="ib" id="btn-redo" title="Redo (Shift+Ctrl+Z)" aria-label="Redo"><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
    <button class="zoom" id="zoom-label" title="Zoom" aria-label="Zoom options">100%</button>
    <button class="ib" id="btn-theme" title="Light / dark" aria-label="Toggle dark mode"><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg></button>
    <button class="ib" id="btn-present" title="Preview as a website" aria-label="Preview"><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4.5l12 7.5-12 7.5z"/></svg></button>
    <button class="btn primary" id="btn-code" title="Get code (Ctrl+E)"><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg><span>Get code</span></button>
    <button class="ib only-narrow" id="toggle-right" aria-label="Design panel" title="Design"><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>
</header>

<main id="viewport" data-tool="move" aria-label="Canvas">
  <div id="world"></div>
  <div id="overlay" aria-hidden="true"></div>
</main>

<aside class="panel left" aria-label="Layers and assets">
  <div class="tabs" role="tablist">
    <button data-left-tab="layers" role="tab">Layers</button>
    <button data-left-tab="assets" role="tab">Assets</button>
  </div>
  <div id="left-body" class="panel-body"></div>
</aside>

<aside class="panel right" aria-label="Properties">
  <div class="tabs" role="tablist">
    <button data-right-tab="design" role="tab">Design</button>
    <button data-right-tab="code" role="tab">Code</button>
  </div>
  <div id="right-body" class="panel-body"></div>
</aside>

<nav id="toolbar" class="toolbar" aria-label="Tools"></nav>

<noscript><p class="noscript">Frame Studio needs JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
